[env:teensymm]
platform = teensy
board = teensymm
framework = arduino
upload_port = /dev/teensy
monitor_port = /dev/ttyACM0
monitor_speed = 115200
lib_deps =
	mjbots/Moteus@^1.0.2
	pierremolinaro/ACAN2517FD@^2.1.4
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.3
build_flags = -lm
